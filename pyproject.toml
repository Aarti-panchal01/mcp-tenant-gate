[project]
name = "mcp-tenant-gate"
version = "0.1.0"
description = "A multi-tenant security gateway for MCP servers, with an attack suite."
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "anyio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = ["scikit-learn>=1.5", "scipy>=1.11", "numpy>=1.26"]  # only to retrain the classifier

[tool.setuptools]
packages = ["mcp_tenant_gate", "mcp_tenant_gate.scanners", "upstreams", "attacks", "evals", "demo"]

[tool.setuptools.package-data]
"mcp_tenant_gate.scanners" = ["clf_model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end to end over real stdio subprocesses (slower)"]
